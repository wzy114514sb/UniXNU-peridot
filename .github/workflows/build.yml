name: build

on:
  push:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: macos-14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: peridot
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: base
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi
          submodules: recursive
      - name: Toolchain
        run: |
          python3 --version
          xcodebuild -version
      - name: Select configuration
        working-directory: base
        run: ./unixnu defconfig peridot_defconfig --device ../peridot
      - name: Authenticate GitHub API calls
        run: python3 peridot/scripts/ci-patch-api-auth.py base/scripts/prepare-xnu-source.py
      - name: Fetch sources
        working-directory: base
        run: ./unixnu fetch --device ../peridot
      - name: Assemble tree
        working-directory: base
        run: ./unixnu tree --device ../peridot
      - name: Build kernel
        working-directory: base
        run: ./unixnu build kernel --device ../peridot
      - name: Build firmware
        working-directory: base
        run: ./unixnu build firmware --device ../peridot --uefi ../uefi
      - name: Build payload
        working-directory: base
        run: ./unixnu build payload --device ../peridot
      - name: Pack boot image
        working-directory: base
        run: ./unixnu bootimg --device ../peridot --uefi ../uefi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peridot-out
          path: |
            base/out/**/*.img
            base/out/**/*.log
          if-no-files-found: warn
